name: Reconcile Packet Training

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-inference-packet-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: cloud-production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: 0.11.29
      - name: Reconcile desired and actual state
        working-directory: projects/visual-inference
        env:
          DSTACK_SERVER_URL: ${{ secrets.DSTACK_SERVER_URL }}
          DSTACK_PROJECT: ${{ secrets.DSTACK_PROJECT }}
          DSTACK_TOKEN: ${{ secrets.DSTACK_TOKEN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          PACKET_API_KEY: ${{ secrets.PACKET_API_KEY }}
          PACKET_SSH_PRIVATE_KEY: ${{ secrets.PACKET_SSH_PRIVATE_KEY }}
          PACKET_SSH_KEY_ID: ${{ secrets.PACKET_SSH_KEY_ID || secrets.CLOUD_SSH_KEY_ID }}
          PACKET_STORAGE_BLOCK_ID: ${{ secrets.PACKET_STORAGE_BLOCK_ID }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: ${{ secrets.WANDB_PROJECT }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
        run: |
          set -euo pipefail
          uv sync --frozen --group cloud
          uv tool install --force 'dstack==0.20.28'
          uv run python scripts/cloud/packet_bridge.py reconcile
