name: Cloud Production Training (Lean)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Cloud GPU Provider'
        required: true
        default: 'packet'
        type: choice
        options:
          - packet
          - runpod
      gpu_type:
        description: 'GPU Type'
        required: true
        default: 'rtx4090'
        type: choice
        options:
          - rtx4090
          - rtx6000
          - l40s
          - a100
          - b200
      container_image:
        description: 'Base Docker Image for Training'
        required: true
        default: 'nvcr.io/nvidia/pytorch:26.07-py3'
        type: string

      config_path:
        description: 'Training Configuration Path'
        required: true
        default: 'configs/phase3_attnres.yaml'
        type: string
      wandb_run_name:
        description: 'W&B Run Name (optional)'
        required: false
        type: string
      resume_path:
        description: 'Resume Checkpoint Path (optional, e.g. /workspace/runs/my_run/last.pt)'
        required: false
        type: string
      batch_size:
        description: 'Batch Size Override (optional, leave blank to autotune)'
        required: false
        type: string
      extra_training_args:
        description: 'Extra python arguments (e.g. --max-steps 5 --max-val-batches 2)'
        required: false
        type: string
      extra_params:
        description: 'Extra provider parameters (JSON, e.g. {"pool_id": "144"})'
        required: false
        type: string

jobs:
  cloud-training:
    name: Run Cloud Training
    runs-on: ubuntu-latest
    environment: packet-production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Local Sanity Tests
        working-directory: projects/visual-inference
        run: |
          uv sync --frozen --group dev
          uv run pytest -q tests

      - name: Configure Local SSH Key
        env:
          RAW_PRIVATE_KEY: ${{ secrets.CLOUD_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [[ -z "${RAW_PRIVATE_KEY:-}" ]]; then
            echo "--> Error: Neither CLOUD_SSH_PRIVATE_KEY nor SSH_PRIVATE_KEY secret is set in GitHub Secrets!"
            exit 1
          fi
          printf '%s\n' "$RAW_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "--> Validating SSH private key format..."
          if ssh-keygen -l -f ~/.ssh/id_rsa >/dev/null 2>&1; then
            echo "--> Private key fingerprint: $(ssh-keygen -l -f ~/.ssh/id_rsa)"
          else
            echo "--> Error: The key written to ~/.ssh/id_rsa is invalid or corrupted."
            echo "    Please check your CLOUD_SSH_PRIVATE_KEY secret in GitHub."
            exit 1
          fi

      - name: Provision Cloud GPU Instance
        id: provision
        working-directory: projects/visual-inference
        env:
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY || secrets.RUNPOD_API_KEY || secrets.PACKET_API_KEY }}
          CLOUD_SSH_KEY_ID: ${{ secrets.CLOUD_SSH_KEY_ID }}
        run: |
          uv run python scripts/cloud/cli.py start_instance \
            --provider "${{ inputs.provider }}" \
            --gpu-type "${{ inputs.gpu_type }}" \
            --container-image "${{ inputs.container_image }}" \
            ${{ inputs.extra_params && format('--extra-json ''{0}''', inputs.extra_params) || '' }} > instance.json
          cat instance.json
          INSTANCE_ID=$(jq -r .instance_id instance.json)
          IP_ADDRESS=$(jq -r .ip_address instance.json)
          SSH_PORT=$(jq -r '.ssh_port // 22' instance.json)
          SSH_USER=$(jq -r '.ssh_user // "ubuntu"' instance.json)
          echo "=================================================="
          echo "🚀 Provisioned Server IP: $IP_ADDRESS"
          echo "🔌 SSH Port:             $SSH_PORT"
          echo "👤 SSH User:             $SSH_USER"
          echo "🆔 Instance ID:          $INSTANCE_ID"
          echo "=================================================="
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV
          echo "IP_ADDRESS=$IP_ADDRESS" >> $GITHUB_ENV
          echo "SSH_PORT=$SSH_PORT" >> $GITHUB_ENV
          echo "SSH_USER=$SSH_USER" >> $GITHUB_ENV

      - name: Wait for SSH to be ready
        run: |
          echo "--> Waiting for SSH daemon to become responsive..."
          for i in {1..30}; do
            if ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 -o BatchMode=yes -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.IP_ADDRESS }} "echo 'SSH is ready!'"; then
              echo "--> SSH connection established successfully."
              exit 0
            fi
            echo "--> Attempt $i failed. Retrying in 10 seconds..."
            sleep 10
          done
          echo "--> Error: SSH never became available."
          exit 1

      - name: Register Instance with Janitor
        run: |
          echo '{"instance_id": "${{ env.INSTANCE_ID }}", "provider": "${{ inputs.provider }}", "timestamp": '$(date +%s)'}' > instance_janitor.json
          aws s3 cp instance_janitor.json s3://${{ secrets.S3_BUCKET }}/janitor/${{ env.INSTANCE_ID }}.json --endpoint-url ${{ secrets.S3_ENDPOINT_URL }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Execute Remote Cloud Training (Async via tmux)
        run: |
          echo "--> Creating local environment file..."
          cat << 'EOF' > gha_env
          REPO_URL=https://github.com/${{ github.repository }}.git
          COMMIT_SHA=${{ github.sha }}
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          S3_ENDPOINT_URL=${{ secrets.S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          WANDB_API_KEY=${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT=${{ secrets.WANDB_PROJECT }}
          WANDB_ENTITY=${{ secrets.WANDB_ENTITY }}
          CONFIG_PATH=${{ inputs.config_path }}
          WANDB_RUN_NAME=${{ inputs.wandb_run_name }}
          RESUME_PATH=${{ inputs.resume_path }}
          CLOUD_API_KEY="${{ secrets.CLOUD_API_KEY || secrets.RUNPOD_API_KEY || secrets.PACKET_API_KEY }}"
          CLOUD_PROVIDER="${{ inputs.provider }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          BATCH_SIZE="${{ inputs.batch_size }}"
          EXTRA_TRAINING_ARGS="${{ inputs.extra_training_args }}"
          EOF

          echo "--> Uploading entrypoint script and env file to ${{ env.SSH_USER }}@${{ env.IP_ADDRESS }}..."
          scp -i ~/.ssh/id_rsa -o ServerAliveInterval=60 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -P ${{ env.SSH_PORT }} projects/visual-inference/scripts/cloud/remote_entrypoint.sh gha_env ${{ env.SSH_USER }}@${{ env.IP_ADDRESS }}:/tmp/
          
          echo "--> Scrubbing local secrets file..."
          rm gha_env
          
          echo "--> Launching training in the background using nohup..."
          ssh -i ~/.ssh/id_rsa -o ServerAliveInterval=60 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.IP_ADDRESS }} bash -s << 'EOF'
            nohup bash -c 'set -a; source /tmp/gha_env; bash /tmp/remote_entrypoint.sh' > /tmp/training.log 2>&1 &
          EOF

      - name: Wait for Training Startup Confirmation
        run: |
          echo "--> Tailing logs to ensure PyTorch and Autotune start correctly..."
          ssh -i ~/.ssh/id_rsa -o ServerAliveInterval=60 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p ${{ env.SSH_PORT }} ${{ env.SSH_USER }}@${{ env.IP_ADDRESS }} bash -s << 'EOF'
            timeout 900 tail -f /tmp/training.log | while read line; do
              echo "$line"
              if [[ "$line" == *'Starting quad proposal training'* ]] || [[ "$line" == *'Starting background periodic sync'* ]] || [[ "$line" == *'Autotune benchmark script crashed'* ]]; then
                echo "--> 🚀 Training startup confirmed! Disconnecting GitHub Action safely..."
                pkill -P $$ tail || true
                exit 0
              fi
            done
          EOF

      - name: Mark Disconnect Safe
        run: echo "DISCONNECT_SAFE=true" >> $GITHUB_ENV

      - name: Terminate Cloud GPU Instance (Cleanup)
        if: always() && env.DISCONNECT_SAFE != 'true'
        working-directory: projects/visual-inference
        env:
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY || secrets.RUNPOD_API_KEY || secrets.PACKET_API_KEY }}
        run: |
          if [ -n "${{ env.INSTANCE_ID }}" ]; then
            echo "Killing instance ${{ env.INSTANCE_ID }} on provider ${{ inputs.provider }}..."
            uv run python scripts/cloud/cli.py kill_instance \
              --provider "${{ inputs.provider }}" \
              --instance-id "${{ env.INSTANCE_ID }}"
          fi


