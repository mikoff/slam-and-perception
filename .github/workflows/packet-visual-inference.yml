name: Submit Cloud Training

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Cloud capacity provider
        required: true
        default: runpod
        type: choice
        options: [runpod, packet]
      gpu:
        description: Exact GPU model; RTX6000 means RTX PRO 6000 Blackwell 96GB
        required: true
        default: RTX4090
        type: choice
        options: [RTX4090, RTX6000, L40S, A100, B200]
      config:
        description: Versioned training recipe
        required: true
        default: configs/phase3.yaml
        type: choice
        options:
          - configs/phase3.yaml
          - configs/phase3_attnres.yaml
          - configs/phase3_rtx4090_bs128_v1.yaml
      dataset_id:
        description: Immutable S3 dataset identifier
        required: true
        type: string
      mode:
        description: Training, bounded smoke, or GPU batch preflight
        required: true
        default: production
        type: choice
        options: [production, smoke, batch_preflight]
      batch_candidates:
        description: Batch sizes tested only in batch_preflight mode
        required: true
        default: 16,32,64,96,128
        type: string
      run_name:
        description: Optional display name; run identity remains immutable
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: visual-inference-cloud-${{ inputs.provider }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  submit:
    name: Submit ${{ inputs.provider }} training
    runs-on: ubuntu-latest
    environment: cloud-production
    # Covers the bounded 15m host bootstrap and 15m image-pull window,
    # plus provisioning, dependency setup, and the 1m runtime stability gate.
    timeout-minutes: 45
    env:
      DSTACK_SERVER_URL: ${{ secrets.DSTACK_SERVER_URL }}
      DSTACK_PROJECT: ${{ secrets.DSTACK_PROJECT }}
      DSTACK_TOKEN: ${{ secrets.DSTACK_TOKEN }}
      RUN_ID: vi-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_DISPLAY_NAME: ${{ inputs.run_name }}
      DSTACK_GPU: ${{ inputs.gpu }}
      CONFIG_PATH: ${{ inputs.config }}
      DATASET_ID: ${{ inputs.dataset_id }}
      RUN_MODE: ${{ inputs.mode }}
      BATCH_CANDIDATES: ${{ inputs.batch_candidates }}
      SOURCE_COMMIT: ${{ github.sha }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      WANDB_PROJECT: ${{ secrets.WANDB_PROJECT }}
      WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
      PACKET_API_KEY: ${{ secrets.PACKET_API_KEY }}
      PACKET_SSH_PRIVATE_KEY: ${{ secrets.PACKET_SSH_PRIVATE_KEY }}
      PACKET_SSH_KEY_ID: ${{ secrets.PACKET_SSH_KEY_ID || secrets.CLOUD_SSH_KEY_ID }}
      PACKET_STORAGE_BLOCK_ID: ${{ secrets.PACKET_STORAGE_BLOCK_ID }}

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: 0.11.29
          enable-cache: true

      - name: Install locked project and dstack CLI
        working-directory: projects/visual-inference
        run: |
          set -euo pipefail
          uv sync --frozen --group cloud
          uv tool install --force 'dstack==0.20.28'

      - name: Verify dispatch and immutable dataset manifest
        working-directory: projects/visual-inference
        run: |
          set -euo pipefail
          uv run python scripts/cloud/run_training.py --verify-env --verify-dataset

      - name: Submit native RunPod task
        if: inputs.provider == 'runpod'
        working-directory: projects/visual-inference
        run: uv run python scripts/cloud/submit_dstack_task.py

      - name: Provision Packet and submit SSH-fleet task
        if: inputs.provider == 'packet'
        working-directory: projects/visual-inference
        run: uv run python scripts/cloud/packet_bridge.py submit

      - name: Submission summary
        run: |
          {
            echo '### Cloud training started'
            echo ''
            echo "- Run ID: \`${RUN_ID}\`"
            echo "- Provider: \`${{ inputs.provider }}\`"
            echo "- GPU: \`${DSTACK_GPU}\`"
            echo "- Config: \`${CONFIG_PATH}\`"
            echo "- Dataset: \`${DATASET_ID}\`"
            echo "- Mode: \`${RUN_MODE}\`"
            if [[ "${RUN_MODE}" == 'batch_preflight' ]]; then
              echo "- Candidates: \`${BATCH_CANDIDATES}\`"
              echo "- Durable report: \`s3://${S3_BUCKET}/runs/${RUN_ID}/batch-preflight.json\`"
            fi
            echo ''
            if [[ '${{ inputs.provider }}' == 'packet' ]]; then
              echo 'The Packet job waits until dstack reports the task running.'
            fi
            echo 'dstack and W&B are the authoritative runtime status and log sources.'
          } >> "$GITHUB_STEP_SUMMARY"
