name: Visual Inference CI

on:
  pull_request:
    paths:
      - 'projects/visual-inference/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'projects/visual-inference/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: visual-inference-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: 0.11.29
          enable-cache: true
      - name: Lint, test, and verify cloud policy
        working-directory: projects/visual-inference
        run: |
          set -euo pipefail
          uv sync --frozen --group dev
          uv run ruff check --select E9,F63,F7,F82 student_detector scripts tests
          uv run ruff format --check \
            scripts/benchmark_batch_size.py \
            scripts/cloud/*.py \
            student_detector/checkpoint_transport.py \
            student_detector/training_reporting.py \
            student_detector/training_runtime.py
          uv run python scripts/cloud/verify_cloud_config.py
          uv run pytest -q tests
