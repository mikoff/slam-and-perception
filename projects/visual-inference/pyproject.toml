[project]
name = "visual-inference"
version = "0.1.0"
description = "Experiments with neural network distillation and visual inference."
requires-python = ">=3.11,<3.14"
dependencies = [
    "ijson>=3.4,<4",
    "pillow",
    "pyyaml>=6,<7",
    "tensorboard>=2.21.0",
    "timm>=1.0.27,<2",
    "torch",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["student_detector"]

[dependency-groups]
dev = [
    "pytest>=8",
]
inspection = [
    "ai-edge-model-explorer>=0.1.32,<0.2",
    "matplotlib>=3.10",
    "numpy>=1.26",
    "tensorboard>=2.20",
    "torchinfo>=1.8",
    "torchview>=0.2",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
