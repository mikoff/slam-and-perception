data:
  train_annotations: ../../../data/visual-inference-datasets/reports/g1_audit_bundle/open_world/open_world_coco_train.json
  val_annotations: ../../../data/visual-inference-datasets/reports/g1_audit_bundle/open_world/open_world_coco_val.json
  quad_train_annotations: ../../../data/visual-inference-datasets/reports/g1_audit_bundle/open_world/open_world_coco_train.json
  quad_val_annotations: ../../../data/visual-inference-datasets/reports/g1_audit_bundle/open_world/open_world_coco_val.json
  image_root: ../../../data/visual-inference-datasets/output
  index_dir: ../artifacts/phase3/open_world/index
  input_size: 384
  batch_size: 12
  workers: 4
  empty_fraction: 0.075
  domain_weights:
    general: 0.50
    automotive: 0.30
    fisheye: 0.20
  source_domains:
    coco_2017: general
    nuimages: automotive
    bdd100k_images_100k: automotive
    woodscape_rgb_fisheye: fisheye
  source_weights:
    coco_2017: 0.50
    nuimages: 0.18
    bdd100k_images_100k: 0.12
    woodscape_rgb_fisheye: 0.20
  # Only explicit manifest tiles receive a full negative loss. The remaining
  # image is weak/unlabeled and the frozen initial weak-negative weight is zero.
  dense_background_sources: []
  background_loss_weights: {}
  tiny_area: 100
  tiny_min_side: 4
  quad_regular_min_side: 16
  thin_major_axis_min: 8
  thin_aspect_ratio_min: 3
  thin_area: 16

inference:
  pre_nms_top_k: 300
  nms_iou_threshold: 0.9
  max_proposals: 100
  score_mode: objectness

quad:
  top_k: 9
  gamma: 2.0
  scale_sigma: 0.75
  eligible_levels: 2
  # Maximum extent improved assignment coverage but did not improve final AR;
  # retain the matched area-scale control for the one-variable GWD ablation.
  scale_measure: area
  weak_negative_weight: 0.0
  quality_weight: 1.0
  corner_weight: 2.0
  # The beta=0.1 precision ablation failed deterministic G6; retain baseline.
  corner_smooth_l1_beta: 1.0
  # GWD weights 0.25 and 0.05 both failed G6 on the thin fitted quad.
  gwd_weight: 0.0
  validity_weight: 0.05
  quality_focal_beta: 2.0
  quality_target_mode: centerness
  quality_blend: 0.0
  # G5 cost passed, but the matched learning trial regressed AR and IoU-.75;
  # retain the approved proxy branch.
  geometry_quality_target: corner_proxy

schedule:
  # The 60-epoch schedule plateaued and was rejected; restore the matched
  # 40-epoch control after rejecting registered geometry ablations.
  epochs: 40
  freeze_backbone_epochs: 2
  head_learning_rate: 0.0003
  backbone_lr_multiplier: 0.1
  reference_effective_batch: 64
  weight_decay: 0.0001
  warmup_steps: 100
  min_lr_ratio: 0.01
  gradient_clip_norm: 10
  # Long-run cap; a warm-up below prevents early random initialization from
  # dominating. The former fixed 0.9998 retained ~78% after 1,240 updates.
  ema_decay: 0.9962930409
  # Avoid averaging the random initialization while approaching the cap once
  # model updates become incremental.
  ema_ramp_steps: 200
  accumulation_steps: 1
  amp: true
  seed: 42
  checkpoint_every_epochs: 1
  checkpoint_every_steps: 500

pretrained_backbone: true
output_dir: ../artifacts/phase3/open_world/default
